name: build and release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka
          pip install -r requirements.txt

      - name: get version
        shell: pwsh
        run: |
          $version = Select-String -Path app.py -Pattern 'LAUNCHER_VERSION\s*=\s*"([^"]+)"' | ForEach-Object {
            $_.Matches.Groups[1].Value
          }

          if (-not $version) {
            throw "could not find launcher version"
          }

          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: build launcher
        run: |
          build.bat

      - name: verify zip exists
        shell: pwsh
        run: |
          if (!(Test-Path "cayymnlauncher.zip")) {
            throw "cayymnlauncher.zip was not created"
          }

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            cayymnlauncher.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}